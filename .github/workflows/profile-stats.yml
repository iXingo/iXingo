name: Refresh profile stats

on:
  push:
    branches: [master]
    paths: [.github/workflows/profile-stats.yml]
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:

concurrency:
  group: profile-stats

jobs:
  update:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: 'disable_animations=true&show_icons=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage'
          path: profile/stats.svg
          core_version: ''
          fail_on_error: 'true'

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: 'disable_animations=true&layout=donut-vertical&langs_count=6'
          path: profile/top-langs.svg
          core_version: ''
          fail_on_error: 'true'

      - name: Publish changed cards
        run: |
          git add -- profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile stats cards'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
