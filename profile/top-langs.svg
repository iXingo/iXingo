  <circle cx="26" cy="153" r="4" fill="#7a62d6"/>
  <text x="42" y="157" class="label">JavaScript</text>
  <text x="328" y="157" class="value">18.96%</text>
  <circle cx="26" cy="186" r="4" fill="#2c957e"/>
  <text x="42" y="190" class="label">C#</text>
  <text x="328" y="190" class="value">1.31%</text>
  <circle cx="26" cy="219" r="4" fill="#d28b47"/>
  <text x="42" y="223" class="label">CSS</text>
  <text x="328" y="223" class="value">0.35%</text>
  <circle cx="26" cy="252" r="4" fill="#5089af"/>
  <text x="42" y="256" class="label">HTML</text>
  <text x="328" y="256" class="value">0.32%</text>
  <circle cx="26" cy="285" r="4" fill="#8c97aa"/>
