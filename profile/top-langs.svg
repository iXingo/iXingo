<svg xmlns="http://www.w3.org/2000/svg" width="350" height="324" viewBox="0 0 350 324" role="img" aria-labelledby="title description">
  <title id="title">Top languages</title>
  <desc id="description">Share of code in public repositories. Java: 78.88%, JavaScript: 18.96%, C#: 1.31%, CSS: 0.35%, HTML: 0.32%, Python: 0.17%.</desc>
  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      --surface: #f7f8fa;
      --edge: #e0e4eb;
      --strong: #171c26;
      --muted: #495569;
      --accent: #215ac4;
      --accent-soft: #e8effc;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #171b23;
        --edge: #303744;
        --strong: #f2f5fa;
        --muted: #aeb9cc;
        --accent: #a8c6ff;
        --accent-soft: #253551;
      }
    }
    .surface { fill: var(--surface); stroke: var(--edge); }
    .rule { stroke: var(--edge); }
    .heading { fill: var(--strong); font-size: 19px; font-weight: 650; letter-spacing: -.35px; }
    .big { fill: var(--strong); font-size: 27px; font-weight: 660; letter-spacing: -.55px; }
    .caption { fill: var(--muted); font-size: 12px; }
    .label { fill: var(--muted); font-size: 13px; }
    .value { fill: var(--strong); font-size: 13px; font-weight: 620; }
    .rank-bg { fill: var(--accent-soft); }
    .rank { fill: var(--accent); font-size: 11px; font-weight: 640; }
    .value, .rank { text-anchor: end; }
  </style>
  <rect class="surface" x="3.5" y="3.5" width="343" height="317" rx="17"/>
  <text x="22" y="37" class="heading">Top languages</text>
  <text x="22" y="60" class="caption">Share of code in public repositories</text>
  <defs><clipPath id="bar"><rect x="22" y="78" width="306" height="11" rx="5.5"/></clipPath></defs>
  <g clip-path="url(#bar)"><rect x="22.000" y="78" width="241.397" height="11" fill="#3877ec"/><rect x="263.397" y="78" width="58.023" height="11" fill="#7a62d6"/><rect x="321.420" y="78" width="4.009" height="11" fill="#2c957e"/><rect x="325.429" y="78" width="1.071" height="11" fill="#d28b47"/><rect x="326.500" y="78" width="0.979" height="11" fill="#5089af"/><rect x="327.480" y="78" width="0.520" height="11" fill="#8c97aa"/></g>
